services:
  - type: web
    name: sistema-vendas
    runtime: node
    plan: starter
    buildCommand: npm ci && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: CODIGO_CADASTRO
        generateValue: true
