<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Dermosens</title>

    <link rel="stylesheet" href="../css/output.css">
</head>

<body class="min-h-screen bg-[#eef3f1] text-[#202322] flex items-center justify-center">

    <main class="w-full max-w-md px-6 py-10">

        <!-- Marca -->
        <div class="text-center mb-10">

            <div
                class="w-32 h-32 mx-auto mb-6 rounded-full bg-[#819b94] flex items-center justify-center shadow-sm"
            >
                <span class="text-white text-sm tracking-[0.20em] font-light">
                    DERMOSENS
                </span>
            </div>

            <h1 class="text-3xl font-light tracking-wide">
                Sistema de Vendas
            </h1>

            <p class="text-[#65736f] mt-2 text-sm">
                Acesse sua conta para continuar
            </p>

        </div>


        <!-- Card -->
        <div
            class="bg-white border border-[#d8e1de] rounded-2xl p-8 shadow-sm"
        >

            <form id="formLogin">

                <!-- E-mail -->
                <div class="mb-5">

                    <label
                        for="email"
                        class="block text-sm font-medium text-[#46534f] mb-2"
                    >
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                        class="
                            w-full
                            px-4
                            py-3
                            bg-[#f7f9f8]
                            border
                            border-[#ccd7d3]
                            rounded-lg
                            outline-none
                            transition
                            placeholder:text-[#9aa7a3]
                            focus:border-[#819b94]
                            focus:ring-2
                            focus:ring-[#819b94]/20
                        "
                    >

                </div>


                <!-- Senha -->
                <div class="mb-6">

                    <label
                        for="senha"
                        class="block text-sm font-medium text-[#46534f] mb-2"
                    >
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                        class="
                            w-full
                            px-4
                            py-3
                            bg-[#f7f9f8]
                            border
                            border-[#ccd7d3]
                            rounded-lg
                            outline-none
                            transition
                            placeholder:text-[#9aa7a3]
                            focus:border-[#819b94]
                            focus:ring-2
                            focus:ring-[#819b94]/20
                        "
                    >

                </div>


                <!-- Botão -->
                <button
                    type="submit"
                    class="
                        w-full
                        py-3
                        bg-[#819b94]
                        hover:bg-[#6f8982]
                        text-white
                        rounded-lg
                        font-medium
                        tracking-wide
                        transition
                        cursor-pointer
                    "
                >
                    Entrar
                </button>

            </form>


            <!-- Cadastro -->
            <p class="text-center text-sm text-[#74817d] mt-6">

                Ainda não possui uma conta?

                <a
                    href="../cadastro/cadastro.html"
                    class="text-[#647f77] hover:text-[#4f6962] font-semibold"
                >
                    Cadastre-se
                </a>

            </p>

        </div>


        <!-- Rodapé -->
        <p class="text-center text-xs text-[#899692] mt-6 tracking-wide">
            DERMOSENS • COSMÉTICOS E TRATAMENTOS
        </p>

    </main>


    <script src="/login/login.js"></script>

</body>

</html>
