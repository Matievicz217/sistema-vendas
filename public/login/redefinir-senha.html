<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Criar nova senha | Dermosens</title>
  <link rel="stylesheet" href="/css/output.css">
</head>
<body class="min-h-screen bg-[#eef3f1] text-[#202322] flex items-center justify-center">
  <main class="w-full max-w-md px-6 py-10">
    <div class="text-center mb-10">
      <div class="w-32 h-32 mx-auto mb-6 rounded-full bg-[#819b94] flex items-center justify-center shadow-sm"><span class="text-white text-sm tracking-[0.20em] font-light">DERMOSENS</span></div>
      <h1 class="text-3xl font-light tracking-wide">Criar nova senha</h1>
      <p class="text-[#65736f] mt-2 text-sm">Escolha uma nova senha para acessar sua conta.</p>
    </div>
    <div class="bg-white border border-[#d8e1de] rounded-2xl p-8 shadow-sm">
      <form id="formRecuperacao" data-mode="reset">
        <div class="mb-5"><label for="senha" class="block text-sm font-medium text-[#46534f] mb-2">Nova senha</label><input id="senha" name="senha" type="password" autocomplete="new-password" minlength="8" maxlength="128" required class="w-full px-4 py-3 bg-[#f7f9f8] border border-[#ccd7d3] rounded-lg outline-none focus:border-[#819b94]"><p class="text-sm text-[#65736f] mt-2">Use pelo menos 8 caracteres.</p></div>
        <div class="mb-6"><label for="confirmacao" class="block text-sm font-medium text-[#46534f] mb-2">Confirme a nova senha</label><input id="confirmacao" name="confirmacao" type="password" autocomplete="new-password" minlength="8" maxlength="128" required class="w-full px-4 py-3 bg-[#f7f9f8] border border-[#ccd7d3] rounded-lg outline-none focus:border-[#819b94]"></div>
        <p id="feedbackRecuperacao" class="hidden mb-4 text-sm" role="status" aria-live="polite"></p>
        <button id="btnRecuperacao" type="submit" class="w-full py-3 bg-[#819b94] hover:bg-[#6f8982] text-white rounded-lg font-medium tracking-wide transition cursor-pointer">Salvar nova senha</button>
      </form>
      <p class="text-center text-sm mt-6"><a href="/login/esqueci-senha.html" class="text-[#647f77] font-semibold">Solicitar outro link</a></p>
      <p class="text-center text-sm mt-6"><a href="/login/login.html" class="text-[#647f77] hover:text-[#4f6962] font-semibold">Voltar para o login</a></p>
    </div>
    <p class="text-center text-xs text-[#899692] mt-6 tracking-wide">DERMOSENS • COSMÉTICOS E TRATAMENTOS</p>
  </main>
  <script src="/login/recuperacao.js"></script>
</body>
</html>
