<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Sistema de Vendas</title>

    <link rel="stylesheet" href="../css/output.css">
</head>

<body class="min-h-screen bg-gray-950 text-white flex items-center justify-center">

    <main class="w-full max-w-md px-6">

        <div class="text-center mb-8">

            <h1 class="text-3xl font-bold">
                Criar conta
            </h1>

            <p class="text-gray-400 mt-2">
                Cadastre-se para acessar o sistema
            </p>

        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-xl">

            <form id="formCadastro">

             
                <div class="mb-5">

                    <label
                        for="nome"
                        class="block text-sm font-medium text-gray-300 mb-2"
                    >
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                        class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                    >

                </div>

              
                <div class="mb-5">

                    <label
                        for="email"
                        class="block text-sm font-medium text-gray-300 mb-2"
                    >
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                        class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                    >

                </div>

                
                <div class="mb-5">

                    <label
                        for="senha"
                        class="block text-sm font-medium text-gray-300 mb-2"
                    >
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                        class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                    >

                </div>

                
                <div class="mb-6">

                    <label
                        for="confirmarSenha"
                        class="block text-sm font-medium text-gray-300 mb-2"
                    >
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        name="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        required
                        class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                    >

                </div>

                
                <button
                    type="submit"
                    class="w-full py-3 bg-blue-600 hover:bg-blue-700 rounded-lg font-semibold transition"
                >
                    Criar conta
                </button>

            </form>

            <p class="text-center text-sm text-gray-400 mt-6">

                Já possui uma conta?

                <a
                    href="../login/login.html"
                    class="text-blue-500 hover:text-blue-400 font-medium"
                >
                    Fazer login
                </a>

            </p>

        </div>

    </main>

    <script src="./cadastro.js"></script>

</body>
</html>
